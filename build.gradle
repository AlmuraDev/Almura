plugins {
    id 'java-library'
    // see https://projects.neoforged.net/neoforged/moddevgradle
    id 'net.neoforged.moddev' version '2.0.148'
}

// The 1.12.2 code waits in legacy/ and moves back under src/ as it is ported; legacy/ is not part of this build.

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

repositories {
    mavenCentral()
    // Strata's snapshots, until Strata 0.1.0 is released
    maven {
        name = 'CentralSnapshots'
        url = uri('https://central.sonatype.com/repository/maven-snapshots/')
        mavenContent {
            snapshotsOnly()
            includeGroup('org.inspirenxe')
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = uri('https://repo.spongepowered.org/repository/maven-public/')
            }
        }
        filter {
            includeGroup('org.spongepowered')
        }
    }
}

configurations {
    // Mods the dev runs load that the jar does not ship: players install them beside Almura
    localRuntime
    runtimeClasspath.extendsFrom(localRuntime)
}

dependencies {
    // SpongeNeo brings SpongeAPI at run time
    compileOnly("org.spongepowered:spongeapi:${sponge_api_version}")

    // Strata is a mod of its own (client side); compile against its API, run with its NeoForge jar
    compileOnly("org.inspirenxe:strata-api:${strata_version}")
    // The Minecraft adapter too, for screens that need to be a vanilla screen of their own (StrataScreen subclasses)
    compileOnly("org.inspirenxe:strata-minecraft-neoforge:${strata_version}") {
        transitive = false
    }
    // And Strata's core, for hosting a Strata screen outside of a vanilla screen (the in-game HUD)
    compileOnly("org.inspirenxe:strata-spi:${strata_version}")
    compileOnly("org.inspirenxe:strata-core:${strata_version}")
    localRuntime("org.inspirenxe:strata-minecraft-neoforge:${strata_version}")

    // The content loader's reading and converting is tested against the content (runs/client/assets/fs_5) without starting the game
    testImplementation(platform('org.junit:junit-bom:5.11.4'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
    testImplementation('com.google.code.gson:gson:2.11.0')
}

tasks.named('test', Test) {
    useJUnitPlatform()
    // The content to test against, when it has been copied into the dev run
    systemProperty('almura.test.content', project.file('runs/client/assets/fs_5').absolutePath)
    // Absolute, as the game started in the tests runs elsewhere
    systemProperty('almura.test.artifacts', project.file('build/moddev/artifacts').absolutePath)
    systemProperty('almura.test.build', project.file('build').absolutePath)
    // And for the game started in the tests: load the content from there
    systemProperty('almura.content', project.file('runs/client/assets/fs_5').absolutePath)
    testLogging {
        events 'failed'
        showStandardStreams = true
        exceptionFormat = 'full'
    }
}

neoForge {
    version = neoforge_version

    runs {
        configureEach {
            ideName = "Almura ${it.name.capitalize()}"
            logLevel = org.slf4j.event.Level.INFO
            // As the 1.12 dev runs had (-Xincgc is gone since Java 9; coremods are gone too: NeoForge loads the mixins from the jar)
            jvmArguments.addAll('-Xms1024M', '-Xmx4096M')
        }
        client {
            client()
            // Not run/: the 1.12.2 dev client lives there in the Almura-3.5 checkout
            gameDirectory = project.file('runs/client')
            // The dev player's name: Dev, or -PdevUsername=<name> (or devUsername=<name> in ~/.gradle/gradle.properties)
            programArguments.addAll('--username', (project.findProperty('devUsername') ?: 'Dev').toString())
            // ./gradlew runClient -PjoinServer=host:port joins a server straight from startup
            if (project.hasProperty('joinServer')) {
                programArguments.addAll('--quickPlayMultiplayer', project.property('joinServer').toString())
            }
            // ./gradlew runClient -PsampleSkills shows sample skills on the HUD, until skills come from a server
            if (project.hasProperty('sampleSkills')) {
                systemProperty('almura.dev.sampleSkills', 'true')
            }
            // ./gradlew runClient -PsampleNotifications queues sample notifications on joining a world, until they come from a server
            if (project.hasProperty('sampleNotifications')) {
                systemProperty('almura.dev.sampleNotifications', 'true')
            }
            // ./gradlew runClient -PjoinWorld=<save folder> opens a single-player world straight from startup (-PjoinWorld= for the latest)
            if (project.hasProperty('joinWorld')) {
                programArguments.add('--quickPlaySingleplayer')
                if (!project.property('joinWorld').toString().isEmpty()) {
                    programArguments.add(project.property('joinWorld').toString())
                }
            }
        }
        server {
            server()
            programArgument('--nogui')
            gameDirectory = project.file('runs/server')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    // Tests marked with FML's JUnit extension start the game's mod loading (no window, no server), so registration can be checked
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

// A cached -SNAPSHOT is trusted for a day by default; check for a newer Strata on every build
configurations.configureEach {
    resolutionStrategy.cacheChangingModulesFor(0, 'seconds')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    var expandProps = [
            'version'                      : version,
            'mod_id'                       : mod_id,
            'mod_name'                     : mod_name,
            'mod_authors'                  : mod_authors,
            'mod_license'                  : mod_license,
            'mod_description'              : mod_description,
            'minecraft_version_range'      : minecraft_version_range,
            'neoforge_version'             : neoforge_version,
            'neoforge_loader_version_range': neoforge_loader_version_range,
            'sponge_api_version_range'     : sponge_api_version_range
    ]
    filesMatching('META-INF/neoforge.mods.toml') {
        expand expandProps
    }
    inputs.properties(expandProps)
}

tasks.named('jar', Jar) {
    manifest {
        attributes([
                'Implementation-Title'  : mod_name,
                'Implementation-Version': project.version,
                'Implementation-Vendor' : mod_authors
        ])
    }
}
