plugins {
    id 'java-library'
    // see https://projects.neoforged.net/neoforged/moddevgradle
    id 'net.neoforged.moddev' version '2.0.148'
}

// The 1.12.2 code waits in legacy/ and moves back under src/ as it is ported; legacy/ is not part of this build.

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

repositories {
    mavenCentral()
    // Strata's snapshots, until Strata 0.1.0 is released
    maven {
        name = 'CentralSnapshots'
        url = uri('https://central.sonatype.com/repository/maven-snapshots/')
        mavenContent {
            snapshotsOnly()
            includeGroup('org.inspirenxe')
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = uri('https://repo.spongepowered.org/repository/maven-public/')
            }
        }
        filter {
            includeGroup('org.spongepowered')
        }
    }
}

configurations {
    // Mods the dev runs load that the jar does not ship: players install them beside Almura
    localRuntime
    runtimeClasspath.extendsFrom(localRuntime)
}

dependencies {
    // SpongeNeo brings SpongeAPI at run time
    compileOnly("org.spongepowered:spongeapi:${sponge_api_version}")

    // Strata is a mod of its own (client side); compile against its API, run with its NeoForge jar
    compileOnly("org.inspirenxe:strata-api:${strata_version}")
    localRuntime("org.inspirenxe:strata-minecraft-neoforge:${strata_version}")
}

neoForge {
    version = neoforge_version

    runs {
        configureEach {
            ideName = "Almura ${it.name.capitalize()}"
            logLevel = org.slf4j.event.Level.INFO
        }
        client {
            client()
            // Not run/: the 1.12.2 dev client lives there in the Almura-3.5 checkout
            gameDirectory = project.file('runs/client')
        }
        server {
            server()
            programArgument('--nogui')
            gameDirectory = project.file('runs/server')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// A cached -SNAPSHOT is trusted for a day by default; check for a newer Strata on every build
configurations.configureEach {
    resolutionStrategy.cacheChangingModulesFor(0, 'seconds')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    var expandProps = [
            'version'                      : version,
            'mod_id'                       : mod_id,
            'mod_name'                     : mod_name,
            'mod_authors'                  : mod_authors,
            'mod_license'                  : mod_license,
            'mod_description'              : mod_description,
            'minecraft_version_range'      : minecraft_version_range,
            'neoforge_version'             : neoforge_version,
            'neoforge_loader_version_range': neoforge_loader_version_range,
            'sponge_api_version_range'     : sponge_api_version_range
    ]
    filesMatching('META-INF/neoforge.mods.toml') {
        expand expandProps
    }
    inputs.properties(expandProps)
}

tasks.named('jar', Jar) {
    manifest {
        attributes([
                'Implementation-Title'  : mod_name,
                'Implementation-Version': project.version,
                'Implementation-Vendor' : mod_authors
        ])
    }
}
