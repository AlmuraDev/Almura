# Every property used in neoforge.mods.toml must also be in the expandProps map in build.gradle

# Project
version=4.0.0-SNAPSHOT
group=com.almuradev
java_version=25

# Mod
mod_id=almura
mod_name=Almura
mod_authors=AlmuraDev
mod_license=All Rights Reserved
mod_description=Almura for Minecraft 26.3.
minecraft_version=26.3
minecraft_version_range=[26.3, 26.4)

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge
neoforge_version=26.3.0.83
neoforge_loader_version_range=[4,)

# Sponge: SpongeAPI 21 is the API of SpongeNeo for 26.3, see
# https://repo.spongepowered.org/repository/maven-public/org/spongepowered/spongeapi/
# The range starts at the snapshot, because Maven sorts 21.0.0-SNAPSHOT before 21.0.0.
sponge_api_version=21.0.0-SNAPSHOT
sponge_api_version_range=[21.0.0-SNAPSHOT,22)

# Strata, the GUI framework (client side), see https://github.com/InspireNXE/Strata-Minecraft
strata_version=0.1.0-SNAPSHOT

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
